<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<title>mobon guide</title>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/mobon_reset.css?201706292">        
	<style type="text/css">
		* {margin:0;padding:0;border:0;}
		.mobon_banner{width:726px;height:88px;position:relative;border:1px solid #000;overflow:hidden;}
		.mobon_banner:after{content:"";display:block;clear:both;}
		.mobon_banner .text_box .shop_logo{height:30px;margin:4px auto;font-size:0;}
		.mobon_banner .text_box{float:left;width:120px;margin:0 10px;background:#fff;text-align:center;height:88px;cursor:pointer;}
		.mobon_banner .text_box dl{float:left;width:100%;line-height:120%;padding:0 3px;}
		.mobon_banner .text_box dl dt{overflow:hidden;text-overflow:ellipsis; white-space:nowrap;font-size:11px;letter-spacing:-1px;color:#000;padding-bottom:4px;vertical-align:middle;width:100%;}
		.mobon_banner .text_box dl dd.textBox .price{font-size:15px;color:#c73535;font-weight:bold;margin-top:5px;}
		.mobon_banner .text_box dl dd.saleBox .price{color:#000;text-decoration:line-through;font-size:11px;font-weight:500;}
		.mobon_banner .text_box dl dd.saleBox .price2{font-size:12px;font-weight:600;color:#c73535;}
		.mobon_banner .img_sub{float:left;width:570px;}
		.mobon_banner .img_sub ul{float:left;}
		.mobon_banner .img_sub ul li{float:left;width:94px;height:88px;overflow:hidden;cursor:pointer;position:relative;background-size:cover;background-repeat:no-repeat;background-position:center center;}
		.mobon_banner .img_sub ul li.on_box:after{content:"";display:block;position:absolute;top:0;left:0;width:90px;height:84px;border:2px solid #c73535;}
		.w_bg{background-color:#fff!important;}
		.no-display{display:none;}
	</style>
</head>
<body>
	<div id="noHiddenMobon" class="mobon_banner">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="text_box">
			<img class="shop_logo" src="{{logo}}" alt="logo" onERROR="this.src='{{HTTP}}/rtb/images/mobon.jpg'">
			<dl class="goods_dsec">
				<dt class="pnm">{{pnm1}}</dt>
				<dd class="{{box1}}">
					<p class="price">{{price1}}</p>
					<p class="price2">{{price2_1}}</p>
				</dd>
			</dl>
			<dl class="goods_dsec">
				<dt class="pnm">{{pnm2}}</dt>
				<dd class="{{box2}}">
					<p class="price">{{price2}}</p>
					<p class="price2">{{price2_2}}</p>
				</dd>
			</dl>
			<dl class="goods_dsec">
				<dt class="pnm">{{pnm3}}</dt>
				<dd class="{{box3}}">
					<p class="price">{{price3}}</p>
					<p class="price2">{{price2_3}}</p>
				</dd>
			</dl>
			<dl class="goods_dsec">
				<dt class="pnm">{{pnm4}}</dt>
				<dd class="{{box4}}">
					<p class="price">{{price4}}</p>
					<p class="price2">{{price2_4}}</p>
				</dd>
			</dl>
			<dl class="goods_dsec">
				<dt class="pnm">{{pnm5}}</dt>
				<dd class="{{box5}}">
					<p class="price">{{price5}}</p>
					<p class="price2">{{price2_5}}</p>
				</dd>
			</dl>
			<dl class="goods_dsec">
				<dt class="pnm">{{pnm6}}</dt>
				<dd class="{{box6}}">
					<p class="price">{{price6}}</p>
					<p class="price2">{{price2_6}}</p>
				</dd>
			</dl>
		</div>
		<div class="img_sub">
			<ul>
				<li class="on_box item_s" style="background-image:url('{{img1}}');{{ImageSqre}}" onclick="window.open('{{purl1}}');"></li>
				<li class="item_s w_bg" style="background-image:url('{{img2}}');{{ImageSqre}}" onclick="window.open('{{purl2}}');"></li>
				<li class="item_s" style="background-image:url('{{img3}}');{{ImageSqre}}" onclick="window.open('{{purl3}}');"></li>
				<li class="item_s w_bg" style="background-image:url('{{img4}}');{{ImageSqre}}" onclick="window.open('{{purl4}}');"></li>
				<li class="item_s" style="background-image:url('{{img5}}');{{ImageSqre}}" onclick="window.open('{{purl5}}');"></li>
				<li class="item_s w_bg" style="background-image:url('{{img6}}');{{ImageSqre}}" onclick="window.open('{{purl6}}');"></li>
			</ul>
		</div>
	</div>
	{{wp_imgtag}}
	<div style="background: #f3f3f3; font-size: 0;display:none;" id="hiddenMobon">
		<div id="mobon_banner" onclick="window.open('https://mobon.net/bridge/')">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<img src="{{HTTP}}/servlet/image/mobon/728x90.png" />
		</div>
	</div>
	<img src="{{img1}}" onError="imgFail('{{pcode1}}');" style='display: none;' />
	<img src="{{img2}}" onError="imgFail('{{pcode2}}');" style='display: none;' />
	<img src="{{img3}}" onError="imgFail('{{pcode3}}');" style='display: none;' />
	<img src="{{img4}}" onError="imgFail('{{pcode4}}');" style='display: none;' />
	<img src="{{img5}}" onError="imgFail('{{pcode5}}');" style='display: none;' />
	<img src="{{img6}}" onError="imgFail('{{pcode6}}');" style='display: none;' />
</body>
<script type="text/javascript" src="{{HTTP}}/Frtb/common/script/jquery.js"></script>
<script type="text/javascript">
	$(document).ready(function(){
		var active = $(".item_s");
		var timer;
		var index = 0;
		(function loop(idx) {
		$(".goods_dsec").hide().eq(idx).show();
			active.removeClass('on_box').eq(idx).addClass('on_box');
			timer = setTimeout(function () {
				loop((idx + 1) % active.length);
			}, 2000);
		}(0));
		$(".item_s").mouseenter(function(){
			var indexNum=$(".img_sub>ul>li").index(this);
			window.clearTimeout(timer);
			$(".item_s").removeClass("on_box");
			$(this).addClass("on_box");
			$(".goods_dsec").hide().eq(indexNum).show();
			$.each($(".item_s"),function(i){
				if($(this).hasClass("on_box")){
					index = i;
				}
			})
		}).mouseleave(function(){
			(function loop(idx) {
				$(".goods_dsec").hide().eq(idx).show();
				active.removeClass('on_box').eq(idx).addClass('on_box');
				timer = setTimeout(function () {
					loop((idx + 1) % active.length);
				}, 2000);
			}(index));
		});
	});
	
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		document.getElementById("noHiddenMobon").innerHTML = "";
		document.getElementById("hiddenMobon").style.display = '';
		document.getElementById("noHiddenMobon").outerHTML = "";
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
</script>
</html>
