<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<title>mobon guide</title>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/mobon_reset.css?201706292">
	<style type="text/css">
		.mobon_reset{position:relative;width:250px;height:250px;background-color:#fff;margin:0 auto;}
		.mobon_reset .img{position:relative;width:248px;height:248px;background-size:cover;background-position:50% 50%;overflow:hidden;border:1px solid #ddd;cursor:pointer;}
		.mobon_reset .img .saleBox{height:40px;position:absolute;bottom:0;left:0;overflow:hidden;padding:4px 8px;width:234px;z-index:10;text-align:center;}
		.mobon_reset .img .saleBox .name{margin:3px 0 3px;height:15px;overflow:hidden;color:#fff;text-align:center;white-space:nowrap;text-overflow:ellipsis;}
		.mobon_reset .img .saleBox .price{color:#ababab;text-decoration:line-through;font-size:11px;}
		.mobon_reset .img .saleBox .price2{color:#FFFF00;margin-left:8px;font-weight:bold;font-size:13px;}
		.mobon_reset .img .saleBox .text-bg{position:absolute;left:0;bottom:0;width:100%;height:50px;background-color:#000;opacity:.6;filter:Alpha(opacity=60);z-index:-1;}
		.mobon_reset .img .textBox{height:40px;position:absolute;bottom:0;left:0;overflow:hidden;padding:4px 8px;width:234px;z-index:10;text-align:center;}
		.mobon_reset .img .textBox .name{margin:3px 0 3px;height:15px;overflow:hidden;color:#fff;text-align:center;white-space:nowrap;text-overflow:ellipsis;}
		.mobon_reset .img .textBox .price{ccolor:#FFFF00;margin-left:8px;font-weight:bold;font-size:13px;}
	</style>
</head>
<body>
	<div id="noHiddenMobon" class="mobon_reset">
		<div id="mobon_banner">
			<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<div class="img" style="background-image:url('{{img1}}');{{ImageSqre}}" onclick="window.open('{{purl1}}');">
				<div class="{{box1}}">
					<p class="name">{{pnm1}}</p>
					<span class="price">{{price1}}</span>
					<span class="price2">{{price2_1}}</span>
					<div class="text-bg"></div>
				</div>
			</div>
		</div>
	</div>
	{{wp_imgtag}}
	<div style="background: #f3f3f3; font-size: 0;display:none;" id="hiddenMobon">
		<div id="mobon_banner" onclick="window.open('https://mobon.net/bridge/')">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<img src="{{HTTP}}/servlet/image/mobon/250x250.png" />
		</div>
	</div>
	<img src="{{img1}}" onError="imgFail('{{pcode1}}');" style='display: none;' />
</body>
<script type="text/javascript">
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		document.getElementById("noHiddenMobon").innerHTML = "";
		document.getElementById("hiddenMobon").style.display = '';
		document.getElementById("noHiddenMobon").outerHTML = "";
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
</script>
</html>
