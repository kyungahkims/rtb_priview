<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<title>mobon guide</title>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/mobon_reset.css?201706292">
	<script type="text/javascript" src="{{HTTP}}/Frtb/common/script/jquery.js"></script>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/rtb/css/jquery.bxslider.min.css">
	<style type="text/css">
		.mobon_banner{width:300px;height:250px;background:#fff;margin:0 auto;padding:0;position:relative;overflow:hidden;}
		.mobon_banner .shop_logo{width:100%;height:32px;margin:6px 0;padding:0;font-size:0;overflow: hidden;cursor:pointer;}
		.mobon_banner .shop_logo img{height:32px;margin:0 auto;display:block;}
		.mobon_banner ul.goods_box li{overflow:hidden;float:left;cursor:pointer;width:96px;height:96px;background-size:cover;background-repeat:no-repeat;background-position:center center;position:relative; overflow:hidden;margin:2px 2px 2px 1px;box-shadow:2px 3px 4px grey;color:#fff;text-align:center;letter-spacing:-0.5px;}
		.mobon_banner ul.goods_box > li:first-child,.mobon_banner ul.goods_box > li:nth-child(4){margin-left:1px;}
		.mobon_banner ul.goods_box > li .textBox,.mobon_banner ul.goods_box > li .saleBox{display:none;position:absolute;left:0px;top:0px;width:96px;height:96px;background-color:rgba(000,000,000,0.5);vertical-align:middle;font-size:12px;}
		.mobon_banner ul.goods_box > li .textBox p{line-height:100px;}
		.mobon_banner ul.goods_box > li .saleBox .price{text-decoration:line-through;margin:32px 0 3px;}
		.mobon_banner ul.goods_box > li .saleBox .price2{color:#FFFF00;font-size:13px;font-weight:600;}
		.mobon_banner ul.goods_box > li.on .textBox,.mobon_banner ul.goods_box li:hover .textBox,.mobon_banner ul.goods_box > li.on .saleBox,.mobon_banner ul.goods_box li:hover .saleBox{display:block;}
	</style>
</head>
<body>
	<div id="noHiddenMobon" class="mobon_banner">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="shop_logo"><img src="{{logo}}" alt="logo" onERROR="this.src='{{HTTP}}/rtb/images/mobon.jpg'"></div>
		<div class="goods_wrap">
			<ul class="goods_box">
				<li class="on" style="background-image:url('{{img1}}');{{ImageSqre}}" onclick="window.open('{{purl1}}');">
					<div class="{{box1}}">
						<p class="price">{{price1}}</p>
						<p class="price2">{{price2_1}}</p>
					</div>
				</li>
				<li style="background-image:url('{{img2}}');{{ImageSqre}}" onclick="window.open('{{purl2}}');">
					<div class="{{box2}}">
						<p class="price">{{price2}}</p>
						<p class="price2">{{price2_2}}</p>
					</div>
				</li>
				<li style="background-image:url('{{img3}}');{{ImageSqre}}" onclick="window.open('{{purl3}}');">
					<div class="{{box3}}">
						<p class="price">{{price3}}</p>
						<p class="price2">{{price2_3}}</p>
					</div>
				</li>
				<li style="background-image:url('{{img4}}');{{ImageSqre}}" onclick="window.open('{{purl4}}');">
					<div class="{{box4}}">
						<p class="price">{{price4}}</p>
						<p class="price2">{{price2_4}}</p>
					</div>
				</li>
				<li style="background-image:url('{{img5}}');{{ImageSqre}}" onclick="window.open('{{purl5}}');">
					<div class="{{box5}}">
						<p class="price">{{price5}}</p>
						<p class="price2">{{price2_5}}</p>
					</div>
				</li>
				<li style="background-image:url('{{img6}}');{{ImageSqre}}" onclick="window.open('{{purl6}}');">
					<div class="{{box6}}">
						<p class="price">{{price6}}</p>
						<p class="price2">{{price2_6}}</p>
					</div>
				</li>
			</ul>
		</div>
	</div>
	{{wp_imgtag}}
	<div style="background: #f3f3f3; font-size: 0;display:none;" id="hiddenMobon">
		<div id="mobon_banner" onclick="window.open('https://ref.ad-brix.com/v1/referrallink?ak=576324275&ck=1535237')">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<img src="{{HTTP}}/servlet/image/otjalnam/300x250.jpg" />
		</div>
	</div>
	<img src="{{img1}}" onError="imgFail('{{pcode1}}');" style='display: none;' />
	<img src="{{img2}}" onError="imgFail('{{pcode2}}');" style='display: none;' />
	<img src="{{img3}}" onError="imgFail('{{pcode3}}');" style='display: none;' />
	<img src="{{img4}}" onError="imgFail('{{pcode4}}');" style='display: none;' />
	<img src="{{img5}}" onError="imgFail('{{pcode5}}');" style='display: none;' />
	<img src="{{img6}}" onError="imgFail('{{pcode6}}');" style='display: none;' />
</body>
<script type="text/javascript" src="{{HTTP}}/rtb/common/script/jquery.bxslider.min.js"></script>
<script type="text/javascript">
	$(document).ready(function(){
		var goods_index=0
		var timer;
		function loop(){
			if (goods_index == 6 ){
				goods_index = 0
				setTimeout(function(){
					$(".slidesjs-next").click();
				}, 1000);
			}
			timer = setTimeout(function () {
				$(".goods_box>li").removeClass('on');
				$(".goods_box").each(function(){
					$(this).find("li").eq(goods_index).addClass('on');
				});
				goods_index ++
				loop()
			}, 1500);
			$(".mobon_banner").mouseover(function(){
				window.clearTimeout(timer);
				$(".goods_box>li").mouseover(function(){
					$(".goods_box>li").removeClass('on');
					$(this).addClass('on');
				});
			});
		};
		$(".mobon_banner").mouseleave(function(){
			goods_index=0
			loop()
		});
		loop()
	});
	
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		document.getElementById("noHiddenMobon").innerHTML = "";
		document.getElementById("hiddenMobon").style.display = '';
		document.getElementById("noHiddenMobon").outerHTML = "";
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
</script>
</html>
