<!DOCTYPE html>
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1" />
<title>daisy html</title>
<link rel="stylesheet" type="text/css" href="{{HTTP}}/rtb/common/css/mobon_reset.css?20171122" />
<style type="text/css">
body {margin: 0;padding: 0;}
#mobon_type01 {width: 298px;height: 598px;border: 1px solid #ccc;position: relative;font-family: "돋움", dotum;}
#mobon_type01 .mobon_logo {width: 15px;height: 15px;position: absolute;right: 5px;top: 5px;z-index: 100;cursor: pointer;}
#mobon_type01 .mobon_logo img {width: 100%;display: block;}
#mobon_type01 .shop_logo {width: 100%;height: 40px;text-align: center;background: #fff;padding: 103px 0 28px 0;cursor: pointer;font-size: 0;}
#mobon_type01 .shop_logo img {height: 140%;height: 6vh;/*모바일 사파리 전용 높이값*/}
#mobon_type01 .main_img_box {cursor: pointer;background: #fff;font-size: 0;padding-top: 25px;}
#mobon_type01 .main_img_box .item {width: 100%;height: 214px;overflow: hidden;background-size: contain;background-repeat: no-repeat;background-position: center center;border-top-left-radius: 5px;border-top-right-radius: 5px;font-size: 0;}
#mobon_type01 .text_box {position: absolute;bottom: 95px;left: 0;width: 100%;overflow: hidden;text-align: center;padding: 0px 0;}
#mobon_type01 .product_name {padding: 1px 0 8px 0;color: #000;font-size: 18px;font-weight: bold;}
#mobon_type01 .product_price {color: #e00000;font-size: 22px;font-weight: bold;padding-top: 8px;}
#mobon_type01 .product_price {font-size: 18px;text-decoration:line-through;}
#mobon_type01 .product_price2 {color: #e00000;font-size: 22px;font-weight: bold;padding-top: 8px;}
</style>
</head>
<body>
<div id="noHiddenMobon">
<div class="mobon_reset">
<div id="mobon_type01">
<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
<div class="shop_logo" onclick="window.open('{{purl1}}')">
<img src="{{logo}}" alt="logo">
</div>
<div class="main_img_box" id="click0" onclick="window.open('{{purl1}}')">
<div class="item" id="obj0_img" style="background-image: url('{{img1}}');"></div>
</div>
<div class="text_box">
  <div id="obj0_pnm" class="product_name">{{pnm1}}</div>
  <div class="product_price">{{price1}}</div>
  <div class="product_price2">{{price2_1}}</div>
</div>
</div>
</div>
</div>
  {{wp_imgtag}}
	<div class="mobonBanner" id="hiddenMobon" style="display:none;" onclick='window.open("https://mobon.net/bridge/")'>
		<div id="mobonLogo" onclick='window.open("{{HTTP}}/ad/linfo.php")'></div>
		<img src="{{HTTP}}/servlet/image/mobon/300x600.png" >
	</div>
	<img src='{{img1}}' id="test" style='display: none;' onError="imgFail('');"/>
</body>
<script type="text/javascript">
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		document.getElementById("noHiddenMobon").innerHTML = "";
		document.getElementById("noHiddenMobon").outerHTML = "";
		document.getElementById("hiddenMobon").style.display = '';
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
</script>
</html>
