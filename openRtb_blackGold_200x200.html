<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
</head>
<style>
	/* 1. 웹 폰트 */
	@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

	/* 2. 배너 & 이미지 규격 */
	:root {
		--width: 200px;
		--height: 200px;
	}

	/* 3. 공통사항 */
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	.mobonLogo {
		position: absolute;
		top: 2px;
		right: 2px;
		width: 11px;
		height: 11px;
		background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
		background-size: 11px 11px;
		opacity: 0.8;
		z-index: 1001;
		cursor: pointer;
	}

	.mobonLogo:hover {
		width: 73px;
		height: 15px;
		background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
		background-size: 73px 15px;
	}

	/* 4. 해당 사이즈 배너 */
	.mobon_reset {
		position: relative;
		width: var(--width);
		height: var(--height);
		font-family: "pretendard";
		overflow: hidden;
	}

	.mobon_banner {
		width: 100%;
		height: 100%;
		cursor: pointer;
	}

	.img {
		width: 100%;
		height: 100%;
		object-fit: cover;
	}

	.badge {
		position: absolute;
		top: 4px;
		left: 4px;
		display: flex;
		align-items: center;
		gap: 3px;
		font-size: 9px;
		font-weight: 500;
		color: #ffffff;
		border-radius: 25px;
		background-color: rgba(18, 18, 20, 0.85);
		padding: 3px 6px;
		z-index: 2;
	}

	.dot {
		width: 6px;
		height: 6px;
		border-radius: 50%;
		background-color: #ff3b30;
		margin-bottom: 1px;
		animation: blink 1.2s infinite;
	}

	@keyframes blink {

		0%,
		100% {
			opacity: 1;
		}

		50% {
			opacity: 0;
		}
	}

	.bg {
		position: absolute;
		bottom: 0;
		display: flex;
		flex-direction: column;
		justify-content: flex-end;
		width: 100%;
		background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.7) 70%, rgba(0, 0, 0, 0.5) 90%, rgba(0, 0, 0, 0) 100%);
		z-index: 1;
		padding: 13px 10px 10px;
	}

	.pnm {
		font-size: 12px;
		font-weight: 500;
		letter-spacing: -0.24px;
		color: #d8d4cd;
		white-space: nowrap;
		text-overflow: ellipsis;
		overflow: hidden;
	}

	.price_box {
		display: flex;
		align-items: baseline;
		column-gap: 5px;
		margin-top: 2px;
	}

	.sale .sale_rate,
	.sale .sale_price {
		display: block;
	}

	.sale .original_price {
		font-size: 10px;
		font-weight: 500;
		color: #7d7871;
		text-decoration: line-through;
	}

	.sale_rate {
		display: none;
		font-size: 12px;
		font-weight: bold;
		letter-spacing: -0.6px;
		color: #e8c66a;
	}

	.sale_rate span {
		font-size: 9px;
	}

	.sale_price {
		display: none;
		font-size: 15px;
		letter-spacing: -0.6px;
		font-weight: bold;
		color: #ffffff;
	}

	.original_price {
		font-size: 15px;
		letter-spacing: -0.6px;
		font-weight: bold;
		color: #ffffff;
		text-decoration: none;
	}

	.shop_btn {
		position: relative;
		width: 100%;
		height: 26px;
		font-family: inherit;
		font-size: 11px;
		font-weight: 500;
		color: #f0e2b8;
		border: 1px solid #e8c66a;
		background-color: #0d0d0f;
		margin-top: 6px;
		overflow: hidden;
		cursor: pointer;
	}

	.shop_btn::after {
		content: "";
		position: absolute;
		top: 0;
		bottom: 0;
		left: -40px;
		width: 40px;
		pointer-events: none;
		background: linear-gradient(100deg,
				rgba(255, 255, 255, 0) 0%,
				rgba(255, 255, 255, 0.28) 50%,
				rgba(255, 255, 255, 0) 100%);
		animation: shine 2.8s ease-in-out infinite;
	}

	@keyframes shine {
		0% {
			left: -40px;
		}

		55%,
		100% {
			left: 100%;
		}
	}

	/* 5. 대체 배너 */
	.fallback_banner {
		display: none;
		position: relative;
		width: var(--width);
		height: var(--height);
		overflow: hidden;
	}

	.fallback_link {
		display: block;
		width: 100%;
		height: 100%;
		cursor: pointer;
	}

	.fallback_banner img {
		width: 100%;
		height: 100%;
		object-fit: cover;
	}
</style>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner" onclick="window.open('{{purl1}}')">
			<img class="img" src="{{img1}}" data-pcode="{{pcode1}}" alt="{{pnm1}}">
			<div class="badge"><span class="dot"></span>오늘 마감</div>
			<div class="bg">
				<p class="pnm">{{pnm1}}</p>
				<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
				<div class="price_box {{box1}} sale">
					<div class="sale_rate">{{discount1}}<span>%</span></div>
					<div class="sale_price">{{price2_1}}</div>
					<div class="original_price">{{price1}}</div>
				</div>
				<button type="button" class="shop_btn">최저가로 구매하기</button>
			</div>
		</div>
	</div>
	<!-- 노출 추적 태그 -->
	{{wp_imgtag}}

	<!-- 대체 배너 영역 -->
	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/200x200.png" alt="대체배너" />
		</div>
	</div>

	<!--  이미지 에러 감지 -->
	<script>
		(() => {
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const images = document.querySelectorAll('.img');

			let isFallbackTriggered = false;

			const handleImageError = (event) => {
				if (isFallbackTriggered) return;
				isFallbackTriggered = true;

				const pcode = event.target.dataset.pcode || '';

				if (mainBanner) mainBanner.style.display = 'none';
				if (fallbackBanner) fallbackBanner.style.display = 'block';

				const errorUrl =
					`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
				(new Image()).src = errorUrl;
			};

			images.forEach(img => {
				if (img.complete && img.naturalHeight === 0) {
					handleImageError({
						target: img
					});
				} else {
					img.addEventListener('error', handleImageError);
				}
			});
		})();
	</script>
</body>

</html>
