<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<title>mobon guide</title>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/mobon_reset.css?201706292">
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/nr_type1.css?124">
	<style type="text/css">
		.mobon_reset{position:relative;width:300px;height:250px;background-color:#fff;margin:0 auto;}
		#mobon_banner{border:1px solid #ddd;width:298px;height:248px;overflow:hidden;background-size:cover;background-repeat:no-repeat;background-position:center center;cursor:pointer;}
		.border{border:10px solid rgba(255, 255, 255, 0.5);width:278px;height:228px;}
		.light {position:absolute; width:214px; height:248px; left:-300px; background-image:url("//img.mobon.net/Frtb/images/common/light_effect.png"); background-repeat:no-repeat;}
		.light2 {position:absolute; width:214px; height:248px; left:-300px; background-image:url("//img.mobon.net/Frtb/images/common/light_effect_2.png"); background-repeat:no-repeat;}
	</style>
</head>
<body>
<div class="mobon_reset" id="noHiddenMobon" data="bannerA">
	<div class="mobon_reset">
		<div id="mobon_banner" style="background-image:url('{{img}}');" onclick="window.open('{{purl}}')">
			<div class="light"></div>
			<div class="light2"></div>
			<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<div class="border"></div>
		</div>
	</div>
</div>
{{wp_imgtag}}
<div class="mobonBanner" id="hiddenMobon" style="display:none;" onclick='window.open("https://mobon.net/bridge/")'>
	<div id="mobonLogo" onclick='window.open("{{HTTP}}/ad/linfo.php")'></div>
	<img src="{{HTTP}}/servlet/image/mobon/300x250.png" >
</div>
<img src='{{img}}' id="test" style='display: none;' onError="imgFail('');"/>
</body>
<script type="text/javascript">
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		document.getElementById("noHiddenMobon").innerHTML = "";
		document.getElementById("noHiddenMobon").outerHTML = "";
		document.getElementById("hiddenMobon").style.display = '';
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
</script>
<script type="text/javascript" src="//img.mobon.net/Frtb/common/script/jquery.js"></script>
<script type="text/javascript" src="//img.mobon.net/mediaCategory/playLink/animation/js/jquery.easing.1.3.js"></script>
<script type="text/javascript">
	$(document).ready(function(){
		function ani(){
			$(".light").animate({left:"+300"},2000,'easeInQuart').animate({left:"-300"},10).animate({left:"-300"},1000,function(){
			});
			$(".light2").delay(300).animate({left:"+300"},2000,'easeInQuart').animate({left:"-300"},10).animate({left:"-300"},1000,function(){
				ani();
			});
		}
		ani();
	});
</script>
</html>
