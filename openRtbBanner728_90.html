<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<title>mobon guide</title>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/mobon_reset.css?201706292">
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/nr_type1.css?123344444">
	<style type="text/css">
		#mobon_type01{width:728px;height:90px;position:relative;cursor:pointer;}
		#mobon_type01 .img{width:100%;height:100%;background-size:cover;background-repeat:no-repeat;background-position:center center;}
	</style>
</head>
<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div id="mobon_type01">
			<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
			<div class="img" style="background-image:url('{{img}}');" onclick="window.open('{{purl}}')"></div>
		</div>
	</div>
	{{wp_imgtag}}
	<div class="mobonBanner" id="hiddenMobon" style="display:none;" onclick='window.open("https://mobon.net/bridge/")'>
		<div id="mobonLogo" onclick='window.open("{{HTTP}}/ad/linfo.php")'></div>
		<img src="{{HTTP}}/servlet/image/mobon/728x90.png" >
	</div>
	<img src='{{img}}' id="test" style='display: none;' onError="imgFail('');"/>
</body>
<script type="text/javascript">
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		document.getElementById("noHiddenMobon").innerHTML = "";
		document.getElementById("noHiddenMobon").outerHTML = "";
		document.getElementById("hiddenMobon").style.display = '';
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
</script>
</html>
