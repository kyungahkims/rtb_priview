<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
</head>
<style>
	/* 1. 웹 폰트 */
	@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

	/* 2. 배너 & 이미지 규격 */
	:root {
		--width: 728px;
		--height: 90px;
	}

	/* 3. 공통사항 */
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	.mobonLogo {
		position: absolute;
		top: 2px;
		right: 2px;
		width: 11px;
		height: 11px;
		background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
		background-size: 11px 11px;
		opacity: 0.8;
		z-index: 1001;
		cursor: pointer;
	}

	.mobonLogo:hover {
		width: 73px;
		height: 15px;
		background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
		background-size: 73px 15px;
	}

	/* 4. 해당 사이즈 배너 */
	.mobon_reset {
		position: relative;
		display: flex;
		width: var(--width);
		height: var(--height);
		font-family: "pretendard";
		overflow: hidden;
	}

	.mobon_banner_wrap {
		display: flex;
		gap: 6px;
		width: 100%;
		height: 100%;
		background-color: #121214;
		padding: 6px;
	}

	.mobon_banner {
		display: flex;
		flex: 1;
		height: 100%;
		background-color: #1a1a1c;
		border-radius: 2px;
		overflow: hidden;
		cursor: pointer;
	}

	.img {
		flex-shrink: 0;
		width: calc(var(--height) - 12px);
		height: 100%;
		object-fit: cover;
	}

	.bg {
		flex: 1;
		display: flex;
		align-items: center;
		justify-content: flex-start;
		min-width: 0;
		background-color: #121214;
		padding-left: 6px;
	}

	.text_wrap {
		display: flex;
		flex-direction: column;
		justify-content: center;
		row-gap: 4px;
		min-width: 0;
	}

	.pnm {
		font-size: 12px;
		font-weight: 500;
		letter-spacing: -0.24px;
		color: #d8d4cd;
		white-space: nowrap;
		text-overflow: ellipsis;
		overflow: hidden;
	}

	.price_box {
		display: flex;
		align-items: baseline;
		column-gap: 5px;
	}

	.sale .sale_rate,
	.sale .sale_price {
		display: block;
	}

	.sale .original_price {
		font-size: 9px;
		font-weight: 500;
		color: #7d7871;
		text-decoration: line-through;
	}

	.sale_rate {
		display: none;
		font-size: 12px;
		font-weight: bold;
		letter-spacing: -0.6px;
		color: #e8c66a;
	}

	.sale_rate span {
		font-size: 9px;
	}

	.sale_price {
		display: none;
		font-size: 13px;
		letter-spacing: -0.6px;
		font-weight: bold;
		color: #ffffff;
	}

	.original_price {
		font-size: 13px;
		letter-spacing: -0.6px;
		font-weight: bold;
		color: #ffffff;
		text-decoration: none;
	}

	.shop_btn {
		position: relative;
		align-self: flex-start;
		width: fit-content;
		height: 24px;
		font-family: inherit;
		font-size: 10px;
		font-weight: 500;
		color: #f0e2b8;
		border: 1px solid #e8c66a;
		background-color: transparent;
		padding: 0 6px;
		margin-top: 4px;
		overflow: hidden;
		cursor: pointer;
	}

	.shop_btn::after {
		content: "";
		position: absolute;
		top: 0;
		bottom: 0;
		left: -40px;
		width: 20px;
		pointer-events: none;
		background: linear-gradient(100deg,
				rgba(255, 255, 255, 0) 0%,
				rgba(255, 255, 255, 0.28) 50%,
				rgba(255, 255, 255, 0) 100%);
		animation: shine 2.8s ease-in-out infinite;
	}

	@keyframes shine {
		0% {
			left: -40px;
		}

		55%,
		100% {
			left: 100%;
		}
	}

	/* 5. 대체 배너 */
	.fallback_banner {
		display: none;
		position: relative;
		width: var(--width);
		height: var(--height);
		overflow: hidden;
	}

	.fallback_link {
		display: block;
		width: 100%;
		height: 100%;
		cursor: pointer;
	}

	.fallback_banner img {
		width: 100%;
		height: 100%;
		object-fit: cover;
	}
</style>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="mobon_banner_wrap">

			<!-- mobon_banner 1 -->
			<div class="mobon_banner" onclick="window.open('{{purl1}}')">
				<img class="img" src="{{img1}}" data-pcode="{{pcode1}}" alt="{{pnm1}}">
				<div class="bg">
					<div class="text_wrap">
						<p class="pnm">{{pnm1}}</p>
						<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
						<div class="price_box {{box1}} sale">
							<div class="sale_rate">{{discount1}}<span>%</span></div>
							<div class="sale_price">{{price2_1}}</div>
							<div class="original_price">{{price1}}</div>
						</div>
						<button type="button" class="shop_btn">최저가 구매</button>
					</div>
				</div>
			</div>

			<!-- mobon_banner 2 -->
			<div class="mobon_banner" onclick="window.open('{{purl2}}')">
				<img class="img" src="{{img2}}" data-pcode="{{pcode2}}" alt="{{pnm2}}">
				<div class="bg">
					<div class="text_wrap">
						<p class="pnm">{{pnm2}}</p>
						<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
						<div class="price_box {{box2}} sale">
							<div class="sale_rate">{{discount2}}<span>%</span></div>
							<div class="sale_price">{{price2_2}}</div>
							<div class="original_price">{{price2}}</div>
						</div>
						<button type="button" class="shop_btn">최저가 구매</button>
					</div>
				</div>
			</div>

			<!-- mobon_banner 3 -->
			<div class="mobon_banner" onclick="window.open('{{purl3}}')">
				<img class="img" src="{{img3}}" data-pcode="{{pcode3}}" alt="{{pnm3}}">
				<div class="bg">
					<div class="text_wrap">
						<p class="pnm">{{pnm3}}</p>
						<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
						<div class="price_box {{box3}} sale">
							<div class="sale_rate">{{discount3}}<span>%</span></div>
							<div class="sale_price">{{price2_3}}</div>
							<div class="original_price">{{price3}}</div>
						</div>
						<button type="button" class="shop_btn">최저가 구매</button>
					</div>
				</div>
			</div>

		</div>
	</div>
	<!-- 노출 추적 태그 -->
	{{wp_imgtag}}

	<!-- 대체 배너 영역 -->
	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/728x90.png" alt="대체배너" />
		</div>
	</div>

	<!--  이미지 에러 감지 -->
	<script>
		(() => {
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const images = document.querySelectorAll('.img');

			let isFallbackTriggered = false;

			const handleImageError = (event) => {
				if (isFallbackTriggered) return;
				isFallbackTriggered = true;

				const pcode = event.target.dataset.pcode || '';

				if (mainBanner) mainBanner.style.display = 'none';
				if (fallbackBanner) fallbackBanner.style.display = 'block';

				const errorUrl =
					`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
				(new Image()).src = errorUrl;
			};

			images.forEach(img => {
				if (img.complete && img.naturalHeight === 0) {
					handleImageError({
						target: img
					});
				} else {
					img.addEventListener('error', handleImageError);
				}
			});
		})();
	</script>
</body>

</html>
