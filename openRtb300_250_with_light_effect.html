<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<title>mobon guide</title>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/mobon_reset.css?201706292">
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/rtb/css/jquery.bxslider.min.css">

	<style type="text/css">
		#mobonLogo{left:2px;}
		#mobon_banner {width:298px; height:248px; background:#fff; margin:0; padding:0; border:1px solid #ddd; position:relative; overflow:hidden; }
		#mobon_banner:after {content:""; display:block; clear:both;}
		#mobon_banner a,ul,li {text-decoration:none; list-style: none; padding:0; margin:0; color:#666; font-family:"돋움",dotum;}
		#mobon_banner .shop_logo0 {height:40px; margin:10px 0 0 0; font-size:0; overflow: hidden; cursor: pointer; background-image: url("{{logo}}"); background-size: contain; background-position: center center;}
		#mobon_banner .goods_wrap {/*background-color: #1d1c1c;*/ height: 213px;}
		#mobon_banner ul.goods_box { padding: 0 9px;}
		#mobon_banner ul.goods_box:after{content:""; display:block; clear:both;}
		#mobon_banner ul.goods_box li {overflow:hidden; float:left; cursor:pointer; width:130px; height:192px; background:#fff; position:relative; margin: 10px 0px 10px 0px;}
		#mobon_banner ul.goods_box li:first-child {margin-right:5px; margin-left:8px;}
		#mobon_banner ul.goods_box > li .imgBox {height:130px; margin: 0px 0px 6px 0px; font-size:0;}
		#mobon_banner ul.goods_box > li .textBox {font-size:12px; color:#000; text-align:center;}
		.bx-wrapper {border:0 none;box-shadow:none;margin:0;}
		.bx-viewport {padding:15px 0 0 1px;border-left:1px solid #dddddd;}
		.bx-controls {position:absolute;top:0px;width:100%;height:15px; border-left:1px solid #dddddd;}
		.bx-wrapper .bx-pager {padding:0; bottom:0;}
		.bx-wrapper .bx-pager-item {vertical-align:top; margin:0 2px;}
		.pnm {line-height: 16px;font-weight: 600; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; font-size:11px; }
		.price, .sale_price {overflow:hidden; font-weight:600; padding: 6px 0; width:110px; margin:0 auto; color:#fff; background-color: burlywood;}
		.obj0_img,.obj1_img,.shop_logo0{background-size:cover;background-repeat: no-repeat;background-position:center center;}
		.obj0_img{background-image:url('{{img1}}');{{ImageSqre}}}
		.obj1_img{background-image:url('{{img2}}');{{ImageSqre}}}

		#mobon_banner .light {position:absolute; width:214px; height:248px; left:-300px; background-image:url("//img.mobon.net/Frtb/images/common/light_effect.png"); background-repeat:no-repeat;z-index:1;}
        #mobon_banner .light2 {position:absolute; width:214px; height:248px; left:-300px; background-image:url("//img.mobon.net/Frtb/images/common/light_effect_2.png"); background-repeat:no-repeat;z-index:1;}
	</style>
</head>
<body>

<div id="noHiddenMobon">
	<div id="mobon_banner">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="light"></div>
            <div class="light2"></div>

		<div class="shop_logo0" alt="logo" onclick="window.open('{{purl1}}');"></div>
		<div class="goods_wrap">
			<ul class="goods_box">
				<li class="click0" onclick="window.open('{{purl1}}');">
					<div class="imgBox obj0_img"></div>
					<div class="textBox">
						<p class="obj0_pnm pnm">{{pnm1}}</p>
						<p class="no_box obj0_price price">상품바로가기</p>
					</div>
				</li>
				<li class="click1" onclick="window.open('{{purl2}}');">
					<div class="imgBox obj1_img"></div>
					<div class="textBox">
						<p class="obj1_pnm pnm">{{pnm2}}</p>
						<p class="no_box obj1_price price">상품바로가기</p>
					</div>
				</li>
			</ul>
		</div>
	</div>
</div>
<img src="{{img1}}" onError="imgFail('{{pcode1}}');" style='display: none;' />
<img src="{{img2}}" onError="imgFail('{{pcode2}}');" style='display: none;' />
{{wp_imgtag}}
<div style="background: #f3f3f3; font-size: 0;display:none;" id="hiddenMobon">
	<div id="mobon_banner" onclick="window.open('https://ref.ad-brix.com/v1/referrallink?ak=576324275&ck=1535237')">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<img src="{{HTTP}}/servlet/image/otjalnam/300x250.jpg" />
	</div>
</div>
</body>
<script type="text/javascript">
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		document.getElementById("noHiddenMobon").innerHTML = "";
		document.getElementById("hiddenMobon").style.display = '';
		document.getElementById("noHiddenMobon").outerHTML = "";
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
</script>
<script type="text/javascript" src="//img.mobon.net/Frtb/common/script/jquery.js"></script>
<script type="text/javascript" src="//img.mobon.net/Frtb/common/script/jquery.easing.1.3.js"></script>
<script type="text/javascript">
	$(document).ready(function(){
		function ani(){
			$(".light").animate({left:"+300"},2000,'easeInQuart').animate({left:"-300"},10).animate({left:"-300"},1000,function(){
			});
			$(".light2").delay(300).animate({left:"+300"},2000,'easeInQuart').animate({left:"-300"},10).animate({left:"-300"},1000,function(){
				ani();
			});
		}
		ani();
	});
</script>
</html>
