<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>구글RTB 배너</title>
	<style>
		/* 1. 웹 폰트 */
		@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

		/* 2. 배너 & 이미지 규격 */
		:root {
			--width: 160px;
			--height: 600px;
		}

		/* 3. 공통사항 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.mobonLogo {
			position: absolute;
			top: 2px;
			right: 2px;
			width: 11px;
			height: 11px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo02.png') center center;
			background-size: 11px 11px;
			opacity: 0.8;
			z-index: 1001;
			cursor: pointer;
		}

		.mobonLogo:hover {
			width: 73px;
			height: 15px;
			background: url('https://img.mobon.net/newAd/img/logoImg/mobonLogo_over02.png') center center;
			background-size: 73px 15px;
		}

		/* 4. 해당 사이즈 배너 */
		.mobon_reset {
			position: relative;
			display: flex;
			flex-direction: column;
			width: var(--width);
			height: var(--height);
			font-family: "pretendard";
			overflow: hidden;
		}

		.shop_logo {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 70px;
			background-color: #fff;
			padding: 10px 16px;
			cursor: pointer;
		}

		.shop_logo img {
			max-width: 100%;
			height: auto;
		}

		.mobon_banner_wrap {
			display: flex;
			flex-direction: column;
			flex: 1;
			gap: 20px 10px;
			background-color: #121214;
			padding: 17px 10px;
		}

		.mobon_banner {
			position: relative;
			display: flex;
			flex-direction: column;
			flex: 1;
			cursor: pointer;
		}

		.img_wrap {
			width: 100%;
			aspect-ratio: 1 / 1;
			background-color: #1a1a1c;
			border-radius: 2px;
			overflow: hidden;
		}

		.img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.info_wrap {
			display: flex;
			flex-direction: column;
			flex-grow: 1;
			row-gap: 6px;
			margin-top: 8px;
		}

		.pnm {
			min-width: 0;
			font-size: 12px;
			font-weight: 500;
			letter-spacing: -0.24px;
			color: #d8d4cd;
			white-space: nowrap;
			text-overflow: ellipsis;
			overflow: hidden;
		}

		.price_box {
			display: flex;
			flex-direction: column;
		}

		.sale .sale_rate,
		.sale .sale_price {
			display: block;
		}

		.sale .original_price {
			font-size: 11px;
			font-weight: 500;
			color: #7d7871;
			text-decoration: line-through;
			margin-top: 2px;
		}

		.sale_rate {
			display: none;
			position: absolute;
			top: 0;
			right: 0;
			font-size: 12px;
			font-weight: bold;
			letter-spacing: -0.5px;
			color: #121214;
			border-radius: 0 2px 0 4px;
			background-color: #e8c66a;
			padding: 3px 3px;
			z-index: 2;
		}

		.sale_rate span {
			font-size: 8px;
		}

		.sale_price {
			display: none;
			font-size: 15px;
			letter-spacing: -0.6px;
			font-weight: bold;
			color: #ffffff;
		}

		.original_price {
			font-size: 15px;
			letter-spacing: -0.6px;
			font-weight: bold;
			color: #ffffff;
			text-decoration: none;
		}

		.shop_btn {
			position: relative;
			width: 100%;
			height: 30px;
			font-family: inherit;
			font-size: 11px;
			font-weight: 500;
			color: #f0e2b8;
			border: 1px solid #e8c66a;
			background-color: #0d0d0f;
			margin-top: auto;
			overflow: hidden;
			cursor: pointer;
		}

		.shop_btn::after {
			content: "";
			position: absolute;
			top: 0;
			bottom: 0;
			left: -40px;
			width: 30px;
			pointer-events: none;
			background: linear-gradient(100deg,
					rgba(255, 255, 255, 0) 0%,
					rgba(255, 255, 255, 0.28) 50%,
					rgba(255, 255, 255, 0) 100%);
			animation: shine 2.8s ease-in-out infinite;
		}

		@keyframes shine {
			0% {
				left: -40px;
			}

			55%,
			100% {
				left: 100%;
			}
		}

		/* 5. 대체 배너 */
		.fallback_banner {
			display: none;
			position: relative;
			width: var(--width);
			height: var(--height);
			overflow: hidden;
		}

		.fallback_link {
			display: block;
			width: 100%;
			height: 100%;
			cursor: pointer;
		}

		.fallback_banner img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}
	</style>
</head>

<body>
	<div class="mobon_reset" id="noHiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="shop_logo" onclick="window.open('{{purl1}}')">
			<img src="{{logo}}" alt="로고" onerror="this.onerror=null; this.src='{{HTTP}}/rtb/images/mobon.jpg'">
		</div>
		<div class="mobon_banner_wrap">

			<!-- mobon_banner 1 -->
			<div class="mobon_banner" onclick="window.open('{{purl1}}')">
				<div class="img_wrap">
					<img class="img" src="{{img1}}" data-pcode="{{pcode1}}" alt="{{pnm1}}">
				</div>
				<div class="info_wrap">
					<p class="pnm">{{pnm1}}</p>
					<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
					<div class="price_box {{box1}} sale">
						<div class="sale_rate">{{discount1}}<span>%</span></div>
						<div class="sale_price">{{price2_1}}</div>
						<div class="original_price">{{price1}}</div>
					</div>
					<button type="button" class="shop_btn">최저가 구매</button>
				</div>
			</div>

			<!-- mobon_banner 2 -->
			<div class="mobon_banner" onclick="window.open('{{purl2}}')">
				<div class="img_wrap">
					<img class="img" src="{{img2}}" data-pcode="{{pcode2}}" alt="{{pnm2}}">
				</div>
				<div class="info_wrap">
					<p class="pnm">{{pnm2}}</p>
					<!-- 할인 상품인 경우 .price_box에 .sale 추가 -->
					<div class="price_box {{box2}} sale">
						<div class="sale_rate">{{discount2}}<span>%</span></div>
						<div class="sale_price">{{price2_2}}</div>
						<div class="original_price">{{price2}}</div>
					</div>
					<button type="button" class="shop_btn">최저가 구매</button>
				</div>
			</div>

		</div>
	</div>
	<!-- 노출 추적 태그 -->
	{{wp_imgtag}}

	<!-- 대체 배너 영역 -->
	<div class="fallback_banner" id="hiddenMobon">
		<div class="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="fallback_link" onclick="window.open('https://mobon.net/bridge/')">
			<img src="{{HTTP}}/servlet/image/mobon/160x600.png" alt="대체배너" />
		</div>
	</div>

	<!--  이미지 에러 감지 -->
	<script>
		(() => {
			const mainBanner = document.getElementById('noHiddenMobon');
			const fallbackBanner = document.getElementById('hiddenMobon');
			const images = document.querySelectorAll('.img');

			let isFallbackTriggered = false;

			const handleImageError = (event) => {
				if (isFallbackTriggered) return;
				isFallbackTriggered = true;

				const pcode = event.target.dataset.pcode || '';

				if (mainBanner) mainBanner.style.display = 'none';
				if (fallbackBanner) fallbackBanner.style.display = 'block';

				const errorUrl =
					`{{HTTP_DR}}/rtbShop?uid=${encodeURIComponent("{{UUID}}")}&u={{USER}}&pc=${pcode}&itlTpCode={{ITL_TP_CODE}}`;
				(new Image()).src = errorUrl;
			};

			images.forEach(img => {
				if (img.complete && img.naturalHeight === 0) {
					handleImageError({
						target: img
					});
				} else {
					img.addEventListener('error', handleImageError);
				}
			});
		})();
	</script>
</body>

</html>
