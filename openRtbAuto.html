<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html;charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<title>mobon guide</title>
	<link rel="stylesheet" type="text/css" href="{{HTTP}}/Frtb/common/css/mobon_reset.css?201706292">
	<style>
		html,body{height:100%;overflow:hidden;}
		*,body{box-sizing:border-box;margin:0;padding:0;}
		#app{position:relative;background:#fff;width:100%;overflow:hidden;margin:0 auto;}
		.grid{background:#fff;display:inline-block;width:100%;height:auto;padding:2px;}
		.cell{position:relative;float:left;background:#fff;display:block;overflow:hidden;cursor:pointer;padding:2px;}
		.cell .img-box-i{width:100%;height:100%;position:relative;overflow:hidden;cursor:pointer;background-size:cover;background-repeat:no-repeat;background-position:center center;{{ImageSqre}}}
		.cell .img-box-v{width:40%;height:100%;position:relative;float:left;overflow:hidden;cursor:pointer;background-size:cover;background-repeat:no-repeat;background-position:center center;{{ImageSqre}}}
		.cell .text-box-i{position:absolute;width:calc(100% - 4px);bottom:0;left:0;text-align:center;background:rgba(0,0,0,0.3);color:#fff;margin:2px;padding:6px 0;}
		.cell .text-box-v{float:left;text-align:left;width:60%;position:absolute;top:50%;left:40%;transform:translateY(-50%);padding:0 10px;}
		.shop_logo{background-image:url({{logo}});background-size:contain;background-repeat:no-repeat;background-position:center center;width:100%;cursor:pointer;}
		/*.shop_logo{background-image:url({{logo}});background-size:contain;background-repeat:no-repeat;background-position:center center;width:100%;}*/
		.pnm{padding:2% 5%;}
		.price{font-weight:700;text-align:center;}
		.sale_box{position:relative;height:14px;text-align:center;}
		.sale_box p{position:absolute;left:50%;width:100px;margin-left:-50px;}
		.sale_box .price2{color:#f05;text-decoration:line-through;}
		.sale_box .sale_price{opacity:0;filter:alpha(opacity=0);font-weight:700;}
		.dc_box div{position:absolute;top:5px;left:5px;background-color:rgba(255,0,10,.5);width:35px;height:35px;line-height:35px;text-align:center;color:#fff;font-size:12px;z-index:10;font-weight:600;border-radius:50%;}
		.cell .text-box-v .pnm,.cell .text-box-i .pnm{text-overflow:ellipsis;white-space:nowrap;overflow:hidden;}
		.inner-box{position:absolute;width:100%;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-block;border:5px solid #fff;font-size:1.5rem;color:#fff;padding:10px;font-weight: bold;text-align: center;word-break:keep-all;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
		.inner-box small{display:block;word-break:keep-all;padding: 5px 0;font-weight:normal}
	</style>
</head>
<body>
	<div id="app">
		<div id="mobonLogo" onclick="window.open('{{HTTP}}/ad/linfo.php')"></div>
		<div class="shop_logo" onclick="openWin(0)"></div>
<!--		<div class="shop_logo"></div>-->
		<div id="slider">
			<ul class="slide-ul"></ul>
		</div>
	</div>
	{{wp_imgtag}}
	<div id="image_chk" style="display:none;"></div>
</body>
<script type="text/javascript" src="{{HTTP}}/Frtb/common/script/jquery.js"></script>
<script>
	var product = [
		{{productList}}
	];
	var noimage = false;
	var framewidth = {{w}};
	var frameheight = {{h}};	
	$(document).ready(function(){		
		var gridCol = 1;
		var gridRow = 1;		
		if(framewidth == frameheight || (framewidth > frameheight && framewidth/frameheight <= 1.5) || frameheight <= 50) {
			gridCol = 1;
			gridRow = 1;
        } else if(framewidth > frameheight && (frameheight <= 150 && frameheight > 50)) {
        	gridCol = 2;
        	gridRow = 1;        	
        } else if(framewidth > frameheight && framewidth/frameheight > 1.5) {
        	gridCol = 2;
        	gridRow = 1;
        } else if(frameheight > framewidth && frameheight/framewidth <= 1.5) {
        	gridCol = 1;
        	gridRow = 2;
        } else if(frameheight > framewidth && frameheight/framewidth > 1.5) {
        	gridCol = 1;
        	gridRow = 2;
        }		
		var logoType = 1;
		var logoSize = 40;
		var imgNum = gridCol * gridRow;
		var itemWidth = framewidth / gridCol;	
		if (frameheight <= 50) {
			logoSize = 0;
			$('.shop_logo').css({ 'float': 'left', 'width': (framewidth/4) + (framewidth != 100 ? 'px' : '%'), 'height': frameheight + 'px', 'margin': '0 auto' });
			$('#slider').css({'float': 'left','width': ((framewidth/4)*3)+(framewidth != 100 ? 'px' : '%')});
		} else if(frameheight <= 150 && frameheight > 50) {
			logoSize = 0;
			$('.shop_logo').css({ 'float': 'left', 'width': (framewidth/2) + (framewidth != 100 ? 'px' : '%'), 'height': frameheight + 'px', 'margin': '0 auto','background-size':'50%' });
			$('#slider').css({'float': 'left','width': ((framewidth/2))+(framewidth != 100 ? 'px' : '%')});
		} else {
			$('.shop_logo').css({ 'height': logoSize + 'px' });
		}
		var itemHeight = (frameheight - logoSize) / gridRow;
		var type = 'i';
		if (gridRow > 2) {
			var type = 'v';
		} else {
			var type = 'i';
		}
		$("#app").css({ width: (framewidth != 100 ? framewidth : ''), height: frameheight });		
		for (i = 0; i < imgNum; i++) {
			var price="";
			if(product[i].advrtsReplcCode=="01"){
				price = product[i].price + "원";
			}else if(product[i].advrtsReplcCode=="02"){
				price = product[i].advrtsReplcNm;
			}else if(product[i].advrtsReplcCode=="03"){
				price = product[i].advrtsReplcNm +  product[i].price + "원";
			}else{
				price = product[i].price + "원";
			}
			$('.slide-ul').append("<div class='cell' style='width:"+(100/gridCol)+"%;height:"+(itemHeight-2)+"px' onclick='openWin("+i+")'>"
			+ "<div class='img-box-"+type+"'style='background-image:url("+ product[i].img+");'></div>"
			+ "<div class='text-box-"+type+"'>"
			+ "<div class='pnm obj"+i+"_pnm'>"+ product[i].pnm+"</div>" 
			+ (product[i].prdt_prmct ==""?"<p class='price'>"+price+"</p>":"<div class='sale_box'><p class='price2'>"+product[i].price+"원</p><p class='sale_price'>"+product[i].prdt_prmct+"원</p></div>")+(product[i].prdt_prmct==""?"":"</div><div class='dc_box'><div>"+product[i].dc_rate+"%</div></div>"));
			$("#image_chk").append("<img src='"+ product[i].img+"' onError='imgFail("+product[i].pcode+")' style='display:none;' />");
		}
		var divs = $(".slide-ul > div");
		for (var i = 0; i < divs.length; i += imgNum) {
			divs.slice(i, i + imgNum).wrapAll("<li class='grid'></li>");
		}
		function loop() {
			$('.price2').animate({ opacity: "1" }, 500).animate({ opacity: "1" }, 1000).animate({ opacity: "0" }, 500).animate({ opacity: "0" }, 2000, loop);
			$('.sale_price').animate({ opacity: "0" }, 500).animate({ opacity: "0" }, 1000).animate({ opacity: "1" }, 500).animate({ opacity: "1" }, 2000, loop);
		}
		loop();
	});
	function openWin(i) {
		window.open(product[i].purl);
	}
	var uuid = "{{UUID}}";
	var u = "{{USER}}";
	var itlTpCode = "{{ITL_TP_CODE}}";
	function imgFail(pcode) {
		$('.slide-ul').empty();
		if (frameheight <= 150 && framewidth < 500) {
            logoSize = 0;
            gridRow = 1; 
						$('#app').css({"background-image":"url('{{HTTP}}/servlet/image/mobon/200x200.png')","background-size":"contain","background-repeat":"no-repeat","background-position":"center center"});
        } else if (frameheight < 150 && framewidth > 500) {
            logoSize = 0;
            gridRow = 1;
						$('#app').css({"background-image":"url('{{HTTP}}/servlet/image/mobon/200x200.png')","background-size":"contain","background-repeat":"no-repeat","background-position":"center center"});
        } else if (frameheight < 250 && framewidth < 200) {
					$('#app').css({"background-image":"url('{{HTTP}}/servlet/image/mobon/200x200.png')","background-size":"contain","background-repeat":"no-repeat","background-position":"center center"});
        } else {
					$('#app').css({"background-image":"url('{{HTTP}}/servlet/image/mobon/200x200.png')","background-size":"contain","background-repeat":"no-repeat","background-position":"center center"});
        }
		(new Image()).src = document.protocols = '{{HTTP_DR}}/rtbShop?uid=' + encodeURI(uuid) + '&u=' + u + '&pc=' + pcode + '&itlTpCode=' + itlTpCode;
	}
	function openOtjalnam() {
		window.open("https://mobon.net/bridge/");
	}
</script>
</html>
